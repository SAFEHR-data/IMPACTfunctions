# R CMD check without third-party actions.
#
# This repository's Actions policy is "local actions only", so `uses:` steps such
# as actions/checkout and r-lib/actions are refused at startup (the run shows
# `startup_failure` in 0s). Instead, each job runs inside a rocker/r-ver
# container (R preinstalled, Posit Package Manager binaries configured) and does
# the checkout and setup with plain shell/R commands.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

name: R-CMD-check.yaml

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    name: R ${{ matrix.config.r }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {r: 'release', image: 'rocker/r-ver:latest'}
          - {r: 'devel',   image: 'rocker/r-ver:devel'}
          - {r: 'oldrel',  image: 'rocker/r-ver:4.4'}

    container:
      image: ${{ matrix.config.image }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: false

    steps:
      - name: Install system tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates qpdf ghostscript
          /rocker_scripts/install_pandoc.sh

      - name: Check out repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Install package dependencies
        shell: Rscript {0}
        run: |
          options(Ncpus = parallel::detectCores())
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")
          print(utils::sessionInfo())

      - name: R CMD check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual", "--compact-vignettes=gs+qpdf"),
            error_on = "warning",
            check_dir = "check"
          )

      - name: Show testthat output
        if: always()
        run: |
          find check -name 'testthat.Rout*' -exec cat '{}' \; || true
