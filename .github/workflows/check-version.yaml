# Fails a PR into main if DESCRIPTION's Version is not higher than main's.
# Uses only shell commands (no third-party actions), because this repository's
# Actions policy allows local actions only.
name: Check Version Increment

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'DESCRIPTION'
      - '**.R'
      - '**.md'
      - '**.Rmd'

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare DESCRIPTION versions
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA" "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          version_of() { git show "$1:DESCRIPTION" 2>/dev/null | sed -n 's/^Version:[[:space:]]*//p' | tr -d '[:space:]'; }
          ver_pr=$(version_of "$HEAD_SHA")
          ver_base=$(version_of "origin/${BASE_REF}" || true)

          if [ -z "$ver_pr" ]; then
            echo "::error::Could not read Version from the PR's DESCRIPTION."
            exit 1
          fi
          if [ -z "$ver_base" ]; then
            echo "No Version found on ${BASE_REF}; assuming first release."
            exit 0
          fi

          echo "Base branch (${BASE_REF}) version: $ver_base"
          echo "PR branch version:               $ver_pr"

          if dpkg --compare-versions "$ver_pr" gt "$ver_base"; then
            echo "Version has been incremented."
          else
            echo "::error file=DESCRIPTION::Version $ver_pr is not higher than ${BASE_REF}'s $ver_base. Bump Version in DESCRIPTION."
            exit 1
          fi
