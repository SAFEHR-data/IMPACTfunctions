# Builds the pkgdown site and deploys the static output to Netlify.
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   NETLIFY_AUTH_TOKEN - a Netlify personal access token
#   NETLIFY_SITE_ID    - the Site ID of the Netlify site to deploy to
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

name: pkgdown-netlify.yaml

permissions: read-all

jobs:
  pkgdown-netlify:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./docs"
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions (${{ github.sha }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
